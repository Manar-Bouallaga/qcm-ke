<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM ضباط الشرطة – مراجعة وامتحان تجريبي</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1b2236;--mut:#69728a;--pri:#1f4fd8;--ok:#188a52;--okb:#e5f5ec;--ko:#cf3636;--kob:#fceaea;--line:#dde1ec;--sel:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#192031;--ink:#e8ebf4;--mut:#97a0b8;--pri:#6c8cff;--ok:#3fd18a;--okb:#11301f;--ko:#ff6b6b;--kob:#3a1717;--line:#2a3247;--sel:#212c4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:780px;margin:0 auto;padding:14px}h1{font-size:19px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
select,.btn{font:inherit}select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}.btn:disabled{opacity:.4;cursor:default}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.bar{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri);width:0}
.q{font-size:19px;font-weight:700;margin:10px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:right;padding:11px 13px;margin-bottom:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:16px}
.opt b{min-width:20px;color:var(--mut)}.opt:hover:not(:disabled){border-color:var(--pri)}.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ko{background:var(--kob);border-color:var(--ko)}
.res{font-weight:700;margin-top:4px}.timer{font-weight:700;font-variant-numeric:tabular-nums}.timer.low{color:var(--ko)}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.grid button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px}
.grid button.done{background:var(--sel);border-color:var(--pri)}.grid button.cur{outline:2px solid var(--pri)}
.big{font-size:40px;font-weight:800;text-align:center;margin:8px 0}.rev{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.rev .a{color:var(--ok)}.rev .w{color:var(--ko)}label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--mut)}
h3{margin:14px 0 6px;font-size:16px}
</style>
</head>
<body><div class="wrap">
<h1>QCM ضباط الشرطة – مراجعة وامتحان تجريبي</h1>

<div class="card" id="home">
<h3>وضع المراجعة (تصحيح فوري)</h3>
<select id="sec"></select>
<label class="chk"><input type="checkbox" id="shuf" checked> ترتيب عشوائي للأسئلة</label>
<div class="row"><button class="btn pri" id="goStudy">ابدأ المراجعة</button></div>
<h3>وضع الامتحان (50 سؤالا، ساعة واحدة، التصحيح في النهاية)</h3>
<div class="row"><button class="btn pri" id="goExam">ابدأ الامتحان التجريبي</button></div>
</div>

<div class="card" id="quiz" hidden>
<div class="meta"><span id="cnt"></span><span id="sc"></span><span class="timer" id="tm"></span></div>
<div class="bar"><i id="pg"></i></div>
<div class="meta"><span id="stitle"></span></div>
<div class="q" id="qt"></div><div id="opts"></div><div class="res" id="res"></div>
<div class="row"><button class="btn" id="prev">السابق</button><button class="btn pri" id="next">التالي</button><button class="btn" id="fin">إنهاء</button><button class="btn" id="back">القائمة</button></div>
<div class="grid" id="grid" hidden></div>
</div>

<div class="card" id="end" hidden>
<div class="big" id="final"></div><div style="text-align:center" id="msg"></div>
<div class="row" style="justify-content:center"><button class="btn pri" id="again">إعادة</button><button class="btn" id="home2">القائمة</button></div>
<div id="review"></div>
</div>
</div>

function paint(){const x=cur[idx],a=ans[idx];[...$('opts').children].forEach(b=>{const t=b.lastChild.textContent;b.disabled=true;if(t===x.c)b.classList.add('ok');else if(t===a)b.classList.add('ko')});$('res').textContent=a===x.c?'✔ جواب صحيح':'✘ الجواب الصحيح: '+x.c;$('res').style.color=a===x.c?'var(--ok)':'var(--ko)'}
function pick(o){
  if(mode==='study'){if(ans[idx]!==null)return;ans[idx]=o;$('sc').textContent='النقطة: '+score();paint()}
  else{ans[idx]=o;show()}
}
$('next').onclick=()=>{if(idx<cur.length-1){idx++;show()}else if(mode==='study')finish()};
$('prev').onclick=()=>{if(idx>0){idx--;show()}};
$('fin').onclick=()=>{if(mode==='exam'&&ans.some(a=>a===null)&&!confirm('بقيت أسئلة بدون جواب. هل تريد إنهاء الامتحان؟'))return;finish()};
function finish(){
  clearInterval(timer);$('quiz').hidden=true;$('end').hidden=false;
  const s=score(),n=cur.length,p=Math.round(s/n*100);
  $('final').textContent=s+' / '+n+' ('+p+'%)';
  $('msg').textContent=p>=80?'ممتاز، واصل!':p>=50?'مستوى جيد، راجع الأخطاء أسفله.':'تحتاج مزيدا من المراجعة، راجع الأخطاء أسفله.';
  const wrong=cur.map((x,i)=>({x,a:ans[i],i})).filter(r=>r.a!==r.x.c);
  $('review').innerHTML='<h3>الأسئلة التي أخطأت فيها أو تركتها ('+wrong.length+')</h3>';
  wrong.forEach(r=>{const d=document.createElement('div');d.className='rev';d.innerHTML='<div></div><div class="w"></div><div class="a"></div>';
    d.children[0].textContent=(r.i+1)+'. '+r.x.q;d.children[1].textContent='جوابك: '+(r.a===null?'— لم تجب —':r.a);d.children[2].textContent='الصحيح: '+r.x.c;$('review').appendChild(d)});
}
function home(){clearInterval(timer);$('quiz').hidden=true;$('end').hidden=true;$('home').hidden=false}
$('goStudy').onclick=()=>begin('study');$('goExam').onclick=()=>begin('exam');
$('again').onclick=()=>begin(lastMode);$('home2').onclick=home;$('back').onclick=()=>{if(mode==='exam'&&!confirm('سيتم فقدان تقدمك في الامتحان. متابعة؟'))return;home()};
</script></body></html>
