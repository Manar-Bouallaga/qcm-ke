<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM ثقافة عامة - مباراة ضباط الشرطة</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#6b7385;--pri:#1f4fd8;--ok:#1a9b5a;--okbg:#e6f6ee;--ko:#d23b3b;--kobg:#fdeaea;--line:#dfe3ee}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--card:#1a2030;--ink:#e8ebf4;--muted:#98a1b8;--pri:#6c8cff;--ok:#3fd18a;--okbg:#12301f;--ko:#ff6b6b;--kobg:#3a1717;--line:#2b3348}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
select,button{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.q{font-size:19px;font-weight:700;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:right;padding:12px 14px;margin-bottom:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.res{font-weight:700;margin-top:6px}
.big{font-size:42px;font-weight:800;text-align:center;margin:10px 0}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>QCM الثقافة العامة — مباراة ضباط الشرطة</h1>
<div class="card" id="setup">
<label for="sec">اختر المحور:</label>
<select id="sec"></select>
<label class="chk"><input type="checkbox" id="shuf"> ترتيب عشوائي للأسئلة</label>
<div class="row"><button class="btn pri" id="start">ابدأ</button></div>
</div>
<div class="card" id="quiz" hidden>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<div class="bar"><i id="pg"></i></div>
<div class="meta"><span id="stitle"></span></div>
<div class="q" id="qt"></div>
<div id="opts"></div>
<div class="res" id="res"></div>
<div class="row">
<button class="btn" id="prev">السابق</button>
<button class="btn pri" id="next">التالي</button>
<button class="btn" id="home">القائمة</button>
</div>
</div>
<div class="card" id="end" hidden>
<div class="big" id="final"></div>
<div style="text-align:center" id="finalmsg"></div>
<div class="row" style="justify-content:center"><button class="btn pri" id="again">إعادة</button><button class="btn" id="home2">القائمة</button></div>
</div>
</div>

const TAIL=1;
let cur=[],idx=0,score=0,answered=[],order=[];
const $=id=>document.getElementById(id);
const sel=$('sec');
let total=0;SECS.forEach(s=>{total+=s.a.length});
sel.innerHTML='<option value="all">كل المحاور ('+total+' سؤال)</option>'+SECS.map((s,i)=>'<option value="'+i+'">'+s.t+' ('+s.a.length+')</option>').join('');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let n=0;SECS.forEach(s=>s.a=s.a.map(q=>({n:++n,t:s.t,q:q[0],c:q[1],o:q.slice(1)})));
function start(){
 const v=sel.value;let l=[];
 if(v==='all')SECS.forEach(s=>l=l.concat(s.a));else l=SECS[+v].a.slice();
 cur=$('shuf').checked?shuffle(l):l;
 cur=cur.map(x=>({...x,opts:shuffle(x.o)}));
 idx=0;score=0;answered=new Array(cur.length).fill(null);
 $('setup').hidden=true;$('end').hidden=true;$('quiz').hidden=false;show();
}
function show(){
 const x=cur[idx];
 $('cnt').textContent='السؤال '+(idx+1)+' / '+cur.length+' (رقم '+x.n+')';
 $('sc').textContent='النقطة: '+score;
 $('pg').style.width=((idx+1)/cur.length*100)+'%';
 $('stitle').textContent=x.t;
 $('qt').textContent=x.q;
 const box=$('opts');box.innerHTML='';
 x.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>pick(o);box.appendChild(b)});
 $('res').textContent='';
 if(answered[idx]!==null)paint(answered[idx]);
 $('prev').disabled=idx===0;
 $('next').textContent=idx===cur.length-1?'النتيجة':'التالي';
}
function paint(choice){
 const x=cur[idx];
 [...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===x.c)b.classList.add('ok');else if(b.textContent===choice)b.classList.add('ko')});
 $('res').textContent=choice===x.c?'✔ جواب صحيح':'✘ الجواب الصحيح: '+x.c;
 $('res').style.color=choice===x.c?'var(--ok)':'var(--ko)';
}
function pick(o){
 if(answered[idx]!==null)return;
 answered[idx]=o;if(o===cur[idx].c)score++;
 $('sc').textContent='النقطة: '+score;paint(o);
}
$('next').onclick=()=>{if(idx<cur.length-1){idx++;show()}else finish()};
$('prev').onclick=()=>{if(idx>0){idx--;show()}};
function finish(){
 $('quiz').hidden=true;$('end').hidden=false;
 const p=Math.round(score/cur.length*100);
 $('final').textContent=score+' / '+cur.length+' ('+p+'%)';
 $('finalmsg').textContent=p>=80?'ممتاز، واصل!':p>=50?'مستوى جيد، راجع الأخطاء.':'تحتاج مزيدا من المراجعة.';
}
function home(){$('quiz').hidden=true;$('end').hidden=true;$('setup').hidden=false}
$('start').onclick=start;$('again').onclick=start;$('home').onclick=home;$('home2').onclick=home;
</script>
